<main class="pa3 pa4-ns w-100 w-80-ns center">
  <h1>Clima</h1>

  <form onsubmit="obtenerClima(event)">
    <label for="ciudad">Ciudad:</label>
    <input type="text" id="ciudad" placeholder="Ej. Mérida" required>
    <button type="submit">Consultar clima</button>
  </form>

  <div id="resultado-clima" style="margin-top: 20px;">
    Ingresa una ciudad para ver el clima.
  </div>

  <script>
    async function obtenerClima(event) {
      event.preventDefault();

      const ciudad = document.getElementById('ciudad').value.trim();
      const resultado = document.getElementById('resultado-clima');
      resultado.textContent = "Consultando clima...";

      const apiKey = "42IuTguij6KMv7KTV8MppveAkF6HGAC024d7Z4nKvNkMdKC7jSF3Aas0AitMvcqC";

      try {
        const response = await fetch(`https://api-bravo.onrender.com/api/v1/weather/${encodeURIComponent(ciudad)}`, {
          method: 'GET',
          headers: {
            'x-api-key': apiKey,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`No se pudo obtener el clima (${response.status})`);
        }

        const data = await response.json();

        const tempC = (data.main.temp - 273.15).toFixed(1);
        const feelsLikeC = (data.main.feels_like - 273.15).toFixed(1);

        resultado.innerHTML = `
          <h2>Clima en ${data.name}, ${data.sys.country}</h2>
          <p><strong>Descripción:</strong> ${data.weather[0].description}</p>
          <p><strong>Temperatura:</strong> ${tempC} °C</p>
          <p><strong>Sensación térmica:</strong> ${feelsLikeC} °C</p>
          <p><strong>Humedad:</strong> ${data.main.humidity}%</p>
          <p><strong>Viento:</strong> ${data.wind.speed} m/s</p>
          <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="Icono del clima">
        `;
      } catch (error) {
        resultado.textContent = `Error: ${error.message}`;
      }
    }
  </script>
