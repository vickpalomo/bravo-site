<main class="pa3 pa4-ns w-100 w-80-ns center">
  <h1>Chistes</h1>

  <button onclick="obtenerChiste()">Obtener Chiste</button>

  <div id="chiste" style="margin-top: 20px;">
    <p id="chiste-texto">Haz clic en el botón para obtener un chiste.</p>
    <img id="chiste-imagen" src="" alt="Imagen de Chuck Norris" style="display: none; width: 100px; margin-top: 10px;">
  </div>

  <script>
    async function obtenerChiste() {
      const chisteTexto = document.getElementById('chiste-texto');
      const chisteImagen = document.getElementById('chiste-imagen');

      chisteTexto.textContent = "Cargando...";

      const apiKey = "42IuTguij6KMv7KTV8MppveAkF6HGAC024d7Z4nKvNkMdKC7jSF3Aas0AitMvcqC";

      try {
        const response = await fetch('https://api-bravo.onrender.com/api/v1/jokes/random', {
          method: 'GET',
          headers: {
            'x-api-key': apiKey,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) {
          throw new Error('No se pudo obtener el chiste.');
        }

        const data = await response.json();
        chisteTexto.textContent = data.value;

        if (data.icon_url) {
          chisteImagen.src = data.icon_url;
          chisteImagen.style.display = 'block';
        } else {
          chisteImagen.style.display = 'none';
        }
      } catch (error) {
        chisteTexto.textContent = `Error: ${error.message}`;
      }
    }
  </script>
